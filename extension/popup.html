<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TogetherScreen</title>
    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <img
          class="brand-wordmark"
          src="icons/together-screen-wordmark.png"
          alt="Together Screen"
          draggable="false"
        />
        <span id="connectionDot" class="connection-dot" title="Offline"></span>
      </header>

      <section id="videoStatus" class="video-status">
        <div class="video-status-copy">
          <p class="eyebrow">ACTIVE TAB</p>
          <strong id="videoStatusTitle">Checking for video…</strong>
          <small id="videoStatusDetail">Open a page with an HTML5 video.</small>
        </div>

        <button
          id="rescanButton"
          class="icon-button"
          type="button"
          title="Rescan video"
          aria-label="Rescan video"
        >
          ↻
        </button>
      </section>

      <section id="setupView" class="card setup-card">
        <div class="mode-switch" role="tablist" aria-label="Room action">
          <button id="createModeButton" type="button" class="active">CREATE</button>
          <button id="joinModeButton" type="button">JOIN</button>
        </div>

        <div class="form-stack">
          <label class="floating-field">
            <input
              id="nameInput"
              type="text"
              maxlength="30"
              placeholder=" "
              autocomplete="name"
            />
            <span>Name</span>
          </label>

          <div class="room-code-row">
            <label class="floating-field">
              <input
                id="roomInput"
                type="text"
                maxlength="40"
                placeholder=" "
                autocomplete="off"
              />
              <span>Room code</span>
            </label>

            <button id="generateButton" class="secondary-button" type="button">
              Generate
            </button>
          </div>
        </div>

        <button id="submitButton" class="primary-button" type="button">
          Create room
        </button>
        <p id="setupMessage" class="message" role="status"></p>
      </section>

      <section id="roomView" class="card room-card hidden">
        <div class="room-heading">
          <div>
            <p class="eyebrow">ROOM</p>
            <strong id="joinedRoomCode">—</strong>
          </div>
          <span id="roleBadge" class="role-badge">Viewer</span>
        </div>

        <div class="room-stats">
          <article>
            <small>People</small>
            <strong id="peopleCount">0</strong>
          </article>
          <article>
            <small>Ready</small>
            <strong id="readyCount">0</strong>
          </article>
          <article>
            <small>You</small>
            <strong id="yourStatus">Not ready</strong>
          </article>
        </div>

        <div id="followPrompt" class="follow-prompt hidden" role="status">
          <strong id="followPromptTitle">DIFFERENT VIDEO DETECTED</strong>
          <span id="followPromptMessage">The host is watching a different video.</span>
          <div class="follow-prompt-actions">
            <button id="followHostButton" class="primary-button" type="button">Follow host</button>
            <button id="dismissPromptButton" class="secondary-button" type="button">Dismiss</button>
          </div>
        </div>

        <div id="memberList" class="member-list"></div>

        <div class="button-grid">
          <button id="readyButton" class="secondary-button" type="button">Ready</button>
          <button id="startButton" class="primary-button" type="button">Restart together</button>
        </div>

        <button id="leaveButton" class="danger-button" type="button">Leave room</button>
        <p id="roomMessage" class="message" role="status"></p>
      </section>

      <footer class="popup-footer">
        <span class="footer-line" aria-hidden="true"></span>
        <span id="lastEvent">Waiting for a video tab</span>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
