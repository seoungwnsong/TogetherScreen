<!DOCTYPE html>
<html>
  <head>
    <title>TogetherScreen</title>
    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <div class="popup">
      <div class="brand-row">
        <div class="logo">
          <div class="play-icon"></div>
        </div>

        <div>
          <h1>TogetherScreen</h1>
          <p>Connect this video page to your room.</p>
        </div>
      </div>

      <label>Your name</label>
      <input id="nameInput" placeholder="Seoungwan" />

      <label>Room ID</label>
      <input id="roomInput" placeholder="room1" />

      <button id="joinButton">Join Room</button>

      <p id="statusText">Not connected yet.</p>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
